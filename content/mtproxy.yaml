full_instruction: |
  <b>🛡 Инструкция для MTProxy (Telegram)</b>

  MTProxy — это специализированный прокси для обхода блокировок самого мессенджера Telegram.
  Он не маршрутизирует трафик других приложений! Также, MTProxy обходит белые списки.

  1. Перейдите в раздел "Мои подписки" в боте.
  2. Выберите подписку MTProxy.
  3. Нажмите на ссылку подключения (обычно начинается с <code>tg://proxy?...</code> или <code>https://t.me/proxy?...</code>).
  4. Telegram автоматически предложит подключить этот прокси.
  5. Нажмите кнопку <b>"Подключить прокси"</b> (Connect Proxy).

  ВАЖНО! При включении других VPN-сервисов, MTProxy перестанет работать. Вам нужно исключить приложение Telegram из вашего VPN приложение.

  ✅ <b>Готово!</b> Теперь в Telegram в верхней панели появится значок щита (🛡), что означает успешную настройку прокси.

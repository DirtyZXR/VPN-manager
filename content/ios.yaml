full_instruction: |
  ⚠️ <b>ВНИМАНИЕ:</b> Для скачивания приложения необходим Apple ID с регионом, отличным от РФ (например, США). Если у вас российский аккаунт, воспользуйтесь <a href="https://t-j.ru/apple-region/?utm_referrer=https%3A%2F%2Fwww.google.com%2F">инструкцией по смене региона</a>.

  <b>Полная инструкция для iOS / macOS</b>
  Вы можете воспользоваться любым клиентом, поддерживающим протокол, который вам нравится.
  Мой личный совет, приложение <b>HAPP Proxy Utility</b>. Скачать: <a href="https://apps.apple.com/us/app/happ-proxy-utility/id6504287215">ссылка</a>.
  Если у вас уже есть активная подписка, переходите к следующему пункту, если нет, нажмите на кнопку "Запросить подписку".

  Скопируйте сначала одну ссылку из подписки, что у вас есть.
  После установки откройте приложение HAPP и нажмите на кнопку "+". Выберите "Вставить из буфера обмена" (или "Import from Clipboard"). Если у вас в подписке больше одной ссылки, повторите этот процесс.

  Вы можете проверить доступность серверов, нажав на спидометр (или кнопку проверки пинга). Сам пинг может показывать 500, 1000, 2000 м/с, но это не так! Если сервер не доступен, он будет отмечен как "n/a" или "Timeout".

  Подключения с надписью "Обход" - обходят белые списки.
  Подключения с надписью "ВПН" - работают как обычный VPN, без обхода белых списков. Вы можете выбрать любой из них, в зависимости от ваших потребностей в текущий момент.

  ВНИМАТЕЛЬНО проверяйте страну сервера. Российские сервера дают доступ к Телеграму и Инстаграму, но остальные ресурсы, заблокированные в РФ, работать не будут.
  Российские сервера также подойдут, если вам необходим доступ, например, к онлайн-банкингу, который блокирует доступ из страны отличной от РФ.

step_by_step:
  steps:
    - title: "Скачайте клиент"
      text: "⚠️ <b>ВНИМАНИЕ:</b> Для скачивания необходим Apple ID с регионом,
        отличным от РФ (например, США). Если у вас российский аккаунт,
        воспользуйтесь <a
        href=\"https://t-j.ru/apple-region/?utm_referrer=https%3A%2F%2Fwww.goog\
        le.com%2F\">инструкцией по смене региона</a>.


        Моя рекомендация - <b>HAPP Proxy Utility</b>. Скачать: <a
        href=\"https://apps.apple.com/us/app/happ-proxy-utility/id6504287215\">\
        ссылка</a>. Но вы можете использовать любой другой клиент."

    - title: Скопируйте ссылку из подписки
      text: "Скопируйте ссылку из вашей подписки, которую вы получили после оплаты."
      media: "content/images/telegram_sub.png"

    - title: "Импортируйте ссылку в приложение"
      text: |
        Откройте приложение и нажмите на кнопку "+" и выберите "Вставить из буфера обмена".
        Если у вас в подписке больше одной ссылки, повторите этот процесс для каждой ссылки.
      media: "content/images/android_add_sub.png"

    - title: "Проверьте доступность серверов"
      text: |
        Нажмите на спидометр. Серверы, которые не доступны, будут отмечены как "n/a". 
        Пинг может показывать 500, 1000, 2000 м/c, но это не так!"

        "Подключения с надписью "Обход" - обходят белые списки.
        Подключения с надписью "ВПН" - работают как обычный VPN, без обхода белых списков. Выберите любой из них в зависимости от ваших потребностей."

        "ВНИМАТЕЛЬНО проверяйте страну сервера. Российские сервера дают доступ к Телграму и Инстаграму, но остальные ресурсы, заблокированные в РФ, работать не будут.
        Российские сервера также подойдут, если вам необходим доступ, например, к онлайн-банкингу, который блокирует доступ из страны отличной от РФ."

        "Нажмите на сервер, который вы выбрали, и нажмите "Подключиться".
        "Откройте любой заблокированный ресурс и проверьте, работает ли он.
      media: "content/images/android_check_con.png"

    - title: "Настройка тунелирования (опционально)"
      text: |
        Если вы хотите, чтобы только определенные приложения использовали VPN, вы можете настроить раздельное туннелирование в настройках приложения. 
        Это позволит вам указать, какие приложения должны использовать VPN, а какие - нет. Для этого:
        1. Перейдите в настройки приложения.
        2. "Прокси выбраных приложений"
        3. Выберите удобные для вас.

      media: "content/images/tunneling_setings.jpg"

    - title: "Вот мой пример настроек"
      text: "Все российские приложенрия добавлены в исключения, а все остальные
        приложения используют VPN."
      media: "content/images/tunneling_example.jpg"
